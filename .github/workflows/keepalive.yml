name: keepalive
# Free tiers pause idle projects (Qdrant Cloud free cluster after ~1 week). /api/status queries Qdrant, so one request
# every two days keeps it awake. The job also FAILS when the database is unreachable or empty, so GitHub emails you
# instead of the demo quietly breaking for weeks (which is what happened when this job pinged an unset URL).
# It checks the production deployment by default; set the repo variable SPACE_URL (Settings > Secrets and variables >
# Actions > Variables) to point it somewhere else.
on:
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API and check the database
        env:
          SITE_URL: ${{ vars.SPACE_URL || 'https://tanyadewan.vercel.app' }}
        run: |
          curl -fsS --retry 3 --retry-delay 30 --max-time 120 "$SITE_URL/api/status" -o status.json
          cat status.json; echo
          jq -e '(.database // "ok") != "unreachable" and .chunks > 0' status.json > /dev/null \
            || { echo "::error::The vector database is unreachable or empty"; exit 1; }
