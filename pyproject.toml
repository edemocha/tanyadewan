[project]
name = "tanyadewan"
version = "0.1.0"
description = "TanyaDewan: cited answers from the Dewan Rakyat Hansard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "onnxruntime-directml>=1.24.4",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "rapidocr>=3.9.2",
    "tokenizers>=0.23.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
tanyadewan-fetch = "tanyadewan.fetch.__main__:main"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM"]
ignore = ["E501"]  # line length is the formatter's job

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pymupdf", "fitz", "onnxruntime", "onnxruntime.*"]  # onnxruntime-directml ships no type stubs
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
